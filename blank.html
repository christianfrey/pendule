<!DOCTYPE html>
<html>
<head>
<title></title>
<style type="text/css">
body {
  font-size: 12px;
  font-family: helvetica,arial,sans-serif;
  margin: 8px;
  background-color: #fff
}
h3 {
  font-size: 13px;
  color: #fafafa;
  background-image: -webkit-gradient(linear, left top, left bottom, from(#3f3f3f), to(#616161));
  border-top: 1px solid #000;
  padding: 2px;
  margin: 1.2em 0 0 0
}
h3 img {
  margin: 0 4px
}
h3 a {
  color: #fafafa
}
pre {
  margin: 0;
  padding: 7px;
  word-wrap: break-word;
  white-space: pre-wrap;
  background: #f8f8f8;
  border-bottom: 1px solid #ccc
}
pre.hidden {
  display: none
}
button {
  cursor: pointer;
  border: 1px solid #0084b4;
  color: #fff;
  text-shadow: #2e90b1 -1px -1px 0px;
  margin: 0px 10px 0px 0px;
  padding: 5px 10px;
  background-image: -webkit-gradient(linear, left top, left bottom, from(#45b4da), to(#39a9cf));
  border-radius: 2.5px;
  line-height: 10px
}
button:hover {
  background-image: -webkit-gradient(linear, left top, left bottom, from(#39a9cf), to(#45b4da))
}

/* view source */
.webkit-source {
  border-spacing: 0px 0px;
  counter-reset: lines 0;
  font-family: monospace;
  font-size: initial;
  margin: 0px;
  white-space: pre-wrap !important;
  width: 100%;
  word-break: break-word
}
.webkit-line-gutter-backdrop {
  height: 100%;
  left: 0px;
  position: absolute;
  top: 0px;
  z-index: -1
}
.webkit-line-gutter-backdrop, .webkit-line-number {
  -webkit-box-sizing: border-box;
  -webkit-user-select: none;
  background-color: #F0F0F0;
  border-right: 1px solid #bbb;
  padding: 0px 4px;
  width: 31px
}
.webkit-line-number {
  vertical-align: baseline;
  color: gray;
  font-family: Helvetica;
  font-size: 9px;
  text-align: right;
  white-space: nowrap;
  word-break: normal
}
.webkit-line-content {
  vertical-align: baseline;
  padding: 0 5px
}
.webkit-html-comment {
  color: #236e25
}
.webkit-html-tag {
  color: #881280
}
.webkit-html-attribute-name {
  color: #994500
}
.webkit-html-attribute-value {
  color: #1a1aa6
}

/* view images */
.pendule-gallery {
  padding: 10px;
  border: 1px solid #ddd
}
.pendule-gallery table:not(:last-child) {
  margin-bottom: 7px
}
.pendule-gallery th {
  text-align: left;
  width: 180px;
  text-transform: uppercase
}
</style>
<script type="text/javascript">
function setTitle(text) {
  document.title = text;
}

function addHeader(text, withLink) {
  img = document.createElement('img');
  img.src = 'img/block-collapse.png';
  img.addEventListener('click', toggle, false);
  
  h3 = document.createElement('h3');
  h3.appendChild(img);
  if (withLink === undefined) {
    h3.appendChild(document.createTextNode(text));
  } else {
    a = document.createElement('a');
    a.href = text;
    a.target = '_blank';
    a.appendChild(document.createTextNode(text));
    h3.appendChild(a);
  }
  
  document.body.appendChild(h3);
}

function addTag(tag, text) {
  t = document.createElement(tag);
  t.appendChild(document.createTextNode(text));
  document.body.appendChild(t);
}

function toggle(event) { 
  var header = event.target;
  var content = header.parentNode.nextSibling;
  
  if (header.getAttribute('src') === 'img/block-collapse.png') {
    header.setAttribute('src', 'img/block-expand.png');
    content.setAttribute('class', 'hidden');
  } else {
    header.setAttribute('src', 'img/block-collapse.png');
    content.setAttribute('class', '');
  }
}

function collapseAll() {
  var a = document.getElementsByTagName('img');
  for (var i = 0; i < a.length; i++) {
    a[i].src = 'img/block-expand.png';
  }
  var p = document.getElementsByTagName('pre');
  for (i = 0; i < p.length; i++) {
    p[i].setAttribute('class', 'hidden');
  }
}

function expandAll() {
  var a = document.getElementsByTagName('img');
  for (var i = 0; i < a.length; i++) {
    a[i].src = 'img/block-collapse.png';
  }
  var p = document.getElementsByTagName('pre');
  for (i = 0; i < p.length; i++) {
    p[i].setAttribute('class', '');
  }
}

function printStyles(url, inlineStyles, externalStyles) { 
  setTitle('Styles - ' + url);
  
  var btn = document.createElement('button');
  btn.id = 'collapse-all';
  btn.onclick = collapseAll;
  btn.innerText = 'Collapse all';
  document.body.appendChild(btn);
  btn = document.createElement('button');
  btn.id = 'expand-all';
  btn.onclick = expandAll;
  btn.innerText = 'Expand all';
  document.body.appendChild(btn);
  
  var l = inlineStyles.length;
  if (l > 0) {
    addHeader('Inline styles sheets');
    var content = '';
    for (i = 0; i < l; i++) {
      content += inlineStyles[i].content + (i+1 !== l? '\n': '');
    }
    addTag('pre', content);
  }
  
  for (i = 0; i < externalStyles.length; ++i) {
    addHeader(externalStyles[i].href, true);
    
    var request = new XMLHttpRequest();
    request.open('get', externalStyles[i].href, false);
    request.send(null);
    addTag('pre', request.responseText);
  }
}

function printScripts(url, internalScripts, externalScripts) {
  setTitle('Scripts - ' + url);
  
  var btn = document.createElement('button');
  btn.id = 'collapse-all';
  btn.onclick = collapseAll;
  btn.innerText = 'Collapse all';
  document.body.appendChild(btn);
  btn = document.createElement('button');
  btn.id = 'expand-all';
  btn.onclick = expandAll;
  btn.innerText = 'Expand all';
  document.body.appendChild(btn);
  
  for (i = 0; i < internalScripts.length; i++) {
    addHeader('Inline script');
    addTag('pre', internalScripts[i].content);
  }
  
  for (i = 0; i < externalScripts.length; ++i) {
    addHeader(externalScripts[i].src, true);
    
    var request = new XMLHttpRequest();
    request.open('get', externalScripts[i].src, false);
    request.send(null);
    addTag('pre', request.responseText);
  }
}

function printImages(url, imageList) {
  setTitle('Images - ' + url);
  
  var l = imageList.length;
  addTag('h3', '\u00a0' + l + ' image' + (l > 1? 's':''));
  
  if (l > 0) {
    var div = document.createElement('div');
    div.className = 'pendule-gallery';
    for (i = 0; i < l; i++) {
      var image = imageList[i],
          img = document.createElement('img'),
          table = document.createElement('table'),
          a = document.createElement('a');
          tr = null, th = null, td = null;
                 
      tr = document.createElement('tr');
      td = document.createElement('td');
      td.colSpan = 2;
      img.src = image.src;
      td.appendChild(img);
      tr.appendChild(td);
      table.appendChild(tr);
      
      tr = document.createElement('tr');
      th = document.createElement('th');
      td = document.createElement('td');
      th.innerText = 'src';
      a.href = image.src;
      a.target = '_blank';
      a.innerText = image.src;
      td.appendChild(a);
      tr.appendChild(th);
      tr.appendChild(td);
      table.appendChild(tr);
      
      tr = document.createElement('tr');
      th = document.createElement('th');
      td = document.createElement('td');
      th.innerText = 'width';
      td.innerText = image.width;
      tr.appendChild(th);
      tr.appendChild(td);
      table.appendChild(tr);
      
      tr = document.createElement('tr');
      th = document.createElement('th');
      td = document.createElement('td');
      th.innerText = 'height';
      td.innerText = image.height;
      tr.appendChild(th);
      tr.appendChild(td);
      table.appendChild(tr);
      
      if (image.alt) {
        tr = document.createElement('tr');
        th = document.createElement('th');
        td = document.createElement('td');
        th.innerText = 'alt';
        td.innerText = image.alt;
        tr.appendChild(th);
        tr.appendChild(td);
        table.appendChild(tr);
      }
      
      if (image.title) {
        tr = document.createElement('tr');
        th = document.createElement('th');
        td = document.createElement('td');
        th.innerText = 'title';
        td.innerText = image.title;
        tr.appendChild(th);
        tr.appendChild(td);
        table.appendChild(tr);
      }
      
      tr = document.createElement('tr');
      th = document.createElement('th');
      td = document.createElement('td');
      th.innerText = 'background image';
      td.innerText = image.background? 'yes': 'no';
      tr.appendChild(th);
      tr.appendChild(td);
      table.appendChild(tr);
      
      div.appendChild(table);
    }
    document.body.appendChild(div);
  }
}

function printSource(url, source, isSelection) {
  if (isSelection) {
    setTitle('Selection source - ' + url);
  } else {
    setTitle('Generated source - ' + url);
  }
  
  document.body.style.margin = '0';
  var div = document.createElement('div');
  div.className = 'webkit-line-gutter-backdrop';
  document.body.appendChild(div);
  
  var lines = source.split("\n");
  
  var table = document.createElement('table');
  table.className = 'webkit-source';
  var tbody = document.createElement('tbody');
  for (var i = 0, tr, td1, td2; i < lines.length; i++) {
    tr = document.createElement('tr');
    td1 = document.createElement('td');
    td2 = document.createElement('td');
    td1.className = 'webkit-line-number';
    td2.className = 'webkit-line-content';
    td1.innerHTML = (i+1).toString();
    td2.innerHTML = (lines[i] === ''? ' ': lines[i]);
    tr.appendChild(td1);
    tr.appendChild(td2);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  document.body.appendChild(table);
}
</script>
</head>
<body>
</body>
</html>
